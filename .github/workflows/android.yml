name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # На ubuntu-latest SDK уже предустановлен. Не используем
      # android-actions/setup-android: его шаг `sdkmanager tools` падает,
      # потому что пакет tools удалён из современных cmdline-tools.
      - name: Configure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare CI signing keystore
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci-release.jks" \
            -storepass android -keypass android -alias chrononotes \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=ChronoNotes CI" >/dev/null 2>&1
          echo "RELEASE_STORE_FILE=$RUNNER_TEMP/ci-release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=chrononotes" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChronoNotes-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # По тегу v* сборка сама создаёт релиз и прикрепляет APK.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
